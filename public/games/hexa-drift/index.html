<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hexa Drift</title>
  <style>
    body {
      margin: 0;
      background: #1a1a1a;
      color: #f9f5f2;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    canvas {
      background: #252440;
      border: 4px solid #f4ed36;
      box-shadow: 6px 6px 0 #000;
      border-radius: 12px;
      max-width: 100%;
      max-height: 80vh;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 480px;
      max-width: 90%;
      margin-bottom: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .score-val {
      color: #f4ed36;
    }
    .instructions {
      margin-top: 12px;
      font-size: 14px;
      color: #8584bd;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>Score: <span id="score" class="score-val">0</span></div>
    <div>Best: <span id="high-score" class="score-val">0</span></div>
  </div>
  <canvas id="gameCanvas" width="480" height="480"></canvas>
  <div class="instructions">Use LEFT and RIGHT arrow keys to drift / rotate</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');

    let score = 0;
    let highScore = localStorage.getItem('hexa_drift_highscore') || 0;
    highScoreEl.textContent = highScore;

    let gameOver = false;
    let playerAngle = 0;
    const playerRadius = 120; // Radius of orbit
    const playerSize = 12;

    let obstacles = [];
    let spawnTimer = 0;
    let gameSpeed = 2;

    // Controls
    let keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Support touch / mouse controls
    let isMouseDown = false;
    let touchX = 0;
    window.addEventListener('touchstart', e => {
      touchX = e.touches[0].clientX;
      isMouseDown = true;
    });
    window.addEventListener('touchmove', e => {
      if (!isMouseDown) return;
      const dx = e.touches[0].clientX - touchX;
      if (dx < -10) playerAngle -= 0.08;
      if (dx > 10) playerAngle += 0.08;
      touchX = e.touches[0].clientX;
    });
    window.addEventListener('touchend', () => isMouseDown = false);

    function spawnObstacle() {
      // Spawn an obstacle coming from outer borders towards center
      const angle = Math.random() * Math.PI * 2;
      const speed = (1 + Math.random() * 2) * (gameSpeed * 0.5);
      obstacles.push({
        x: canvas.width / 2 + Math.cos(angle) * 300,
        y: canvas.height / 2 + Math.sin(angle) * 300,
        targetX: canvas.width / 2,
        targetY: canvas.height / 2,
        speed: speed,
        size: 15 + Math.random() * 15,
        color: ['#f8c1ba', '#f9cc73', '#b5c995', '#ac4f98'][Math.floor(Math.random() * 4)],
        angle: angle
      });
    }

    function resetGame() {
      score = 0;
      scoreEl.textContent = score;
      obstacles = [];
      gameOver = false;
      playerAngle = 0;
      gameSpeed = 2;
    }

    function update() {
      if (gameOver) {
        if (keys['Space']) resetGame();
        return;
      }

      // Move player rotation
      if (keys['ArrowLeft'] || keys['KeyA']) playerAngle -= 0.06;
      if (keys['ArrowRight'] || keys['KeyD']) playerAngle += 0.06;

      // Spawning
      spawnTimer++;
      if (spawnTimer > Math.max(15, 50 - Math.floor(score / 5))) {
        spawnObstacle();
        spawnTimer = 0;
      }

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const playerX = centerX + Math.cos(playerAngle) * playerRadius;
      const playerY = centerY + Math.sin(playerAngle) * playerRadius;

      // Update obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        
        // Move towards center
        const dx = centerX - obs.x;
        const dy = centerY - obs.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist > 5) {
          obs.x += Math.cos(obs.angle + Math.PI) * obs.speed;
          obs.y += Math.sin(obs.angle + Math.PI) * obs.speed;
        } else {
          // Reached center safely without hit
          obstacles.splice(i, 1);
          score++;
          scoreEl.textContent = score;
          if (score > highScore) {
            highScore = score;
            highScoreEl.textContent = highScore;
            localStorage.setItem('hexa_drift_highscore', highScore);
          }
          if (score % 10 === 0) gameSpeed += 0.5; // Increase difficulty
          continue;
        }

        // Collision detection with orbiting player
        const pDistX = obs.x - playerX;
        const pDistY = obs.y - playerY;
        const pDist = Math.sqrt(pDistX * pDistX + pDistY * pDistY);
        if (pDist < (obs.size / 2 + playerSize)) {
          gameOver = true;
        }
      }
    }

    function draw() {
      // Clear screen
      ctx.fillStyle = '#252440';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // Draw central core
      ctx.beginPath();
      ctx.arc(centerX, centerY, 30, 0, Math.PI * 2);
      ctx.fillStyle = '#1a1a1a';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#f4ed36';
      ctx.stroke();

      // Draw orbit path
      ctx.beginPath();
      ctx.arc(centerX, centerY, playerRadius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(133, 132, 189, 0.2)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.stroke();
      ctx.setLineDash([]); // Reset

      // Draw player (Hexagon shape)
      const playerX = centerX + Math.cos(playerAngle) * playerRadius;
      const playerY = centerY + Math.sin(playerAngle) * playerRadius;
      
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = playerAngle + (i * Math.PI / 3);
        const x = playerX + Math.cos(angle) * playerSize;
        const y = playerY + Math.sin(angle) * playerSize;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = '#f4ed36';
      ctx.fill();
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Draw obstacles (squares/triangles)
      obstacles.forEach(obs => {
        ctx.save();
        ctx.translate(obs.x, obs.y);
        ctx.rotate(obs.angle);
        
        ctx.beginPath();
        // Draw triangular obstacle pointing to center
        ctx.moveTo(-obs.size / 2, -obs.size / 2);
        ctx.lineTo(obs.size / 2, 0);
        ctx.lineTo(-obs.size / 2, obs.size / 2);
        ctx.closePath();
        
        ctx.fillStyle = obs.color;
        ctx.fill();
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        ctx.restore();
      });

      // Draw Game Over Screen
      if (gameOver) {
        ctx.fillStyle = 'rgba(26, 26, 26, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = 'bold 28px Sora, sans-serif';
        ctx.fillStyle = '#f8c1ba';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);

        ctx.font = '16px "IBM Plex Sans", sans-serif';
        ctx.fillStyle = '#f9f5f2';
        ctx.fillText('Press SPACE or Tap screen to Restart', canvas.width / 2, canvas.height / 2 + 20);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
